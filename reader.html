<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LocalReader</title>
<style>
/* ==========================================================================
   Material 3 —— 完整的 tonal palette / 形状 / 状态层 / 动效规范
   ========================================================================== */
:root{
  /* 主色：蓝青（海洋偏青），MD3 tonal palette */
  --p40:#3d6380; --p80:#a9cbe8; --p90:#cfe4f7; --p10:#001f2e;
  --on-p:#ffffff; --on-pc:#001f2e;
  /* 中性 */
  --n100:#000; --n95:#f9f9fc; --n90:#e2e2e6; --n80:#c4c6cc;
  --n40:#606065; --n30:#787880; --n20:#909096; --n10:#a8a8ae;
  /* 语义色容器 */
  --bg:#f9f9fc; --sur:#f9f9fc; --surl:#ffffff;
  --sc-low:#f4f4f8; --sc:#eeeeF2; --sc-hi:#e4e5ea; --sc-high:#dcdee4;
  --fg:#1a1b21; --fg-v:#45464f; --on-sv:#45464f;
  --out:#c4c6cc; --out-v:#dcdde3;
  --err:#ba1a1a; --on-err:#fff;
  /* 形状 */
  --r-xs:4px; --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:28px; --r-full:999px;
  /* 高度 */
  --e1:0 1px 2px rgba(0,0,0,.30),0 1px 3px 1px rgba(0,0,0,.15);
  --e2:0 1px 2px rgba(0,0,0,.30),0 2px 6px 2px rgba(0,0,0,.15);
  --e3:0 4px 8px 3px rgba(0,0,0,.15),0 1px 3px rgba(0,0,0,.30);
  /* 排版 scale */
  --t-title-l:22px/28px; --t-title-m:16px/24px; --t-title-s:14px/20px;
  --t-body-l:16px/24px; --t-body-m:14px/20px; --t-body-s:12px/16px;
  --t-label-l:14px/20px; --t-label-m:12px/16px; --t-label-s:11px/16px;
  /* 动效：MD3 emphasized */
  --em:cubic-bezier(.2,0,0,1); --std:cubic-bezier(.2,0,0,1);
  --d-s:100ms; --d-m:200ms; --d-l:300ms; --d-xl:400ms;
  /* 阅读 */
  --fs:18px; --lh:1.9; --w:720px; --pad:22px;
}
[data-theme="paper"]{
  --bg:#f7f4ee; --sur:#f7f4ee; --surl:#fffdf9;
  --sc-low:#f4f1ea; --sc:#ece8df; --sc-hi:#e3ded3; --sc-high:#dbd5c9;
  --fg:#211f1b; --fg-v:#4a4740; --on-sv:#4a4740;
  --out:#cbc6ba; --out-v:#e2ddd2;
  --p40:#6b4a2f; --p80:#dcbf9f; --p90:#eeddc6; --p10:#241203;
  --on-p:#fff; --on-pc:#241203;
}
[data-theme="green"]{
  --bg:#eef3ec; --sur:#eef3ec; --surl:#f6faf4;
  --sc-low:#e8efe6; --sc:#dfe8dc; --sc-hi:#d5e0d2; --sc-high:#ccd9c9;
  --fg:#161d18; --fg-v:#3e4b42; --on-sv:#3e4b42;
  --out:#b6c3b5; --out-v:#d3ded2;
  --p40:#2f5c37; --p80:#a3cbaa; --p90:#c3e4c7; --p10:#00210a;
  --on-p:#fff; --on-pc:#00210a;
}
[data-theme="night"]{
  --bg:#131418; --sur:#131418; --surl:#1c1e23;
  --sc-low:#191b20; --sc:#202329; --sc-hi:#2a2e35; --sc-high:#353941;
  --fg:#e4e2e9; --fg-v:#c6c4ca; --on-sv:#c6c4ca;
  --out:#8f9199; --out-v:#454851;
  --p40:#8fc7e8; --p80:#1c4866; --p90:#00304a; --p10:#cfe4f7;
  --on-p:#00304a; --on-pc:#cfe4f7;
  --e1:0 1px 3px rgba(0,0,0,.6); --e2:0 2px 8px rgba(0,0,0,.7); --e3:0 4px 14px rgba(0,0,0,.8);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);
  font-family:Roboto,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px;line-height:20px;
  transition:background var(--d-m) var(--std),color var(--d-m) var(--std)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input{font:inherit}
.hidden{display:none !important}

/* ---------------- MD3 组件 ---------------- */
/* AppBar：MD3 small 高度 64dp */
.appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:4px;
  height:64px;padding:0 4px;background:var(--sur);
  transition:background var(--d-m) var(--std),box-shadow var(--d-m) var(--std)}
.appbar.on-scroll{background:var(--sc-hi);box-shadow:var(--e2)}
.appbar h1{margin:0;padding:0 12px;font-size:22px;font-weight:400;letter-spacing:0;
  flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.appbar h1.s{font-size:16px;font-weight:500;padding:0 4px}

/* Icon button：40dp 命中区，状态层 */
.ib{width:40px;height:40px;border-radius:var(--r-full);display:flex;align-items:center;
  justify-content:center;color:var(--fg-v);flex:none;position:relative;overflow:hidden}
.ib::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;
  transition:opacity var(--d-s) var(--std)}
.ib:hover::before{opacity:.08}
.ib:active::before{opacity:.10}
.ib svg{position:relative}

/* Button：Filled / Tonal / Outlined / Text，高 40dp 圆角 20dp */
.btn{height:40px;padding:0 24px;border-radius:var(--r-full);font-size:14px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.btn::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;
  transition:opacity var(--d-s) var(--std)}
.btn:hover::before{opacity:.08}
.btn:active::before{opacity:.10}
.btn>*{position:relative}
.btn.filled{background:var(--p40);color:var(--on-p);box-shadow:var(--e1)}
.btn.filled:active{box-shadow:none}
.btn.tonal{background:var(--p90);color:var(--on-pc)}
.btn.outlined{border:1px solid var(--out);color:var(--p40);background:transparent}
.btn.text{color:var(--p40);padding:0 12px}
.btn.sm{height:32px;padding:0 16px;font-size:13px}

/* FAB：MD3 圆角 16dp */
.fab{position:fixed;right:16px;bottom:20px;height:56px;min-width:56px;padding:0 16px;
  border-radius:var(--r-l);background:var(--p90);color:var(--on-pc);box-shadow:var(--e3);
  display:flex;align-items:center;justify-content:center;gap:12px;
  font-size:14px;font-weight:500;z-index:40;position:fixed;
  transition:box-shadow var(--d-m) var(--std),transform var(--d-m) var(--em)}
.fab:active{box-shadow:var(--e1);transform:scale(.96)}
.fab.ext{padding:0 20px}

/* 书架：横向列表项（左封面 / 右信息） */
.blist{display:flex;flex-direction:column;padding:0 0 96px}
.brow{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--sur);
  position:relative;overflow:hidden;cursor:pointer}
.brow::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;
  transition:opacity var(--d-s) var(--std)}
.brow:hover::before{opacity:.06}
.brow:active::before{opacity:.08}
.brow>*{position:relative}
/* MD3 列表分隔线：左缩进对齐头像右缘 */
.brow+.brow::after{content:"";position:absolute;top:0;left:86px;right:0;height:1px;background:var(--out-v)}
.brow .thumb{width:56px;height:80px;border-radius:var(--r-s);flex:none;overflow:hidden;
  background:var(--sc-hi);display:flex;align-items:center;justify-content:center;
  color:var(--fg-v);font-size:22px;font-weight:500}
.brow .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.brow .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.brow .nmwrap{overflow:hidden;position:relative;height:24px}
.brow .nm{display:block;white-space:nowrap;font:500 var(--t-body-l);color:var(--fg)}
.brow .nmwrap.mq .nm{animation:mq 16s linear infinite}
@keyframes mq{0%,6%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.brow .nmwrap.mq::after{content:"";position:absolute;top:0;right:0;width:24px;height:100%;
  background:linear-gradient(90deg,transparent,var(--sur))}
.brow .sub{font:var(--t-body-s);color:var(--fg-v);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .pbar{height:4px;border-radius:var(--r-full);background:var(--sc-high);overflow:hidden;margin:4px 0 2px}
.brow .pbar i{display:block;height:100%;background:var(--p40);border-radius:var(--r-full);
  transition:width var(--d-l) var(--std)}

/* 空状态：极简 */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:96px 32px;color:var(--fg-v);text-align:center}
.empty svg{color:var(--out);margin-bottom:20px}
.empty .t{font:500 var(--t-title-m);margin-bottom:6px;color:var(--fg-v)}
.empty .s{font:var(--t-body-s);color:var(--n20)}

/* 分章预览 */
.fp{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:32px;padding:0 16px;border-radius:var(--r-s);font:500 var(--t-label-l);
  border:1px solid var(--out);color:var(--fg-v);background:transparent;flex:none;
  display:inline-flex;align-items:center;white-space:nowrap;position:relative;overflow:hidden}
.chip::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity var(--d-s)}
.chip:active::before{opacity:.08}
.chip.on{background:var(--p40);color:var(--on-p);border-color:transparent}
.fld{padding:8px 16px 12px}
.fld input{width:100%;height:56px;padding:0 16px;border:1px solid var(--out);border-radius:var(--r-xs);
  background:var(--surl);color:var(--fg);font:500 var(--t-body-m);outline:none;
  font-family:ui-monospace,Menlo,Consolas,monospace}
.fld input:focus{border:2px solid var(--p40);padding:0 15px}
.fld input::placeholder{color:var(--n20);font-weight:400;font-family:inherit}
.err{color:var(--err);font:var(--t-body-s);margin-top:8px;padding:0 4px}
.lst{flex:1;overflow-y:auto}
.lrow{display:flex;gap:12px;align-items:center;padding:14px 16px;font:var(--t-body-m);
  border-top:1px solid var(--out-v)}
.lrow .no{color:var(--n20);font:var(--t-label-s);min-width:28px;text-align:right}
.lrow .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--fg)}
.lrow .ln{color:var(--n20);font:var(--t-label-s)}
.btmb{display:flex;gap:12px;padding:12px 16px;background:var(--sur);box-shadow:var(--e2)}

/* 搜索：MD3 SearchBar 高 56dp 圆角 28dp */
.sbar{display:flex;align-items:center;gap:4px;height:56px;margin:8px 16px 4px;padding:0 8px 0 16px;
  background:var(--sc-hi);border-radius:var(--r-xl)}
.sbar input{flex:1;border:none;background:none;outline:none;font:var(--t-body-l);
  color:var(--fg);padding:0 8px;min-width:0}
.sbar input::placeholder{color:var(--fg-v)}
.hit{padding:12px 16px;border-top:1px solid var(--out-v);font:var(--t-body-m);
  cursor:pointer;position:relative;overflow:hidden}
.hit::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity var(--d-s)}
.hit:active::before{opacity:.08}
.hit>*{position:relative}
.hit .ch{font:var(--t-label-s);color:var(--fg-v);margin-bottom:4px}
.hit mark{background:var(--p90);color:var(--on-pc);border-radius:2px;padding:0 2px}

/* 阅读器 */
#reader{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;
  transition:background var(--d-m) var(--std)}
#stage{flex:1;position:relative;overflow:hidden;perspective:1600px;
  -webkit-user-select:none;user-select:none;touch-action:none}
.page{position:absolute;inset:0;overflow:hidden;background:var(--bg);backface-visibility:hidden;
  will-change:transform}
.page .in{position:absolute;inset:0;padding:var(--pad) 20px;max-width:calc(var(--w) + 40px);
  margin:0 auto;overflow:hidden}
.page .in p{margin:0 0 .85em;font-size:var(--fs);line-height:var(--lh);text-align:justify;
  text-indent:2em;color:var(--fg);word-break:break-word}
.page .in p.np{text-indent:0}
.page .in h3{margin:0 0 1em;font-size:calc(var(--fs) + 2px);line-height:1.5;color:var(--fg);font-weight:500}
.page .in img{display:block;margin:0 auto 8px;max-width:100%}
.page .in .ph{text-align:center;color:var(--fg-v);font:var(--t-body-s);padding:14px 0}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(0,0,0,0) 55%);
  opacity:0;pointer-events:none}
.pgnum{position:absolute;right:16px;bottom:10px;font:var(--t-label-s);color:var(--fg-v);z-index:5}
.chapname{position:absolute;left:16px;bottom:10px;font:var(--t-label-s);color:var(--fg-v);z-index:5;
  max-width:45%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#meas{position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none;overflow:hidden}
#meas p{margin:0;font-size:var(--fs);line-height:var(--lh);text-align:justify;
  text-indent:2em;word-break:break-word;color:var(--fg)}
#meas p.np{text-indent:0}
#meas h3{margin:0;font-size:calc(var(--fs) + 2px);line-height:1.5;font-weight:500}

/* Navigation drawer（MD3 标准抽屉） */
.drw{position:fixed;inset:0;z-index:80;display:flex}
.drw .scrim{flex:1;background:rgba(0,0,0,.32);opacity:0;animation:scrimIn var(--d-m) var(--std) forwards}
@keyframes scrimIn{to{opacity:1}}
.drw .panel{width:min(88vw,360px);background:var(--sc-low);
  border-radius:0 var(--r-l) var(--r-l) 0;display:flex;flex-direction:column;box-shadow:var(--e2);
  transform:translateX(-100%);animation:drwIn var(--d-l) var(--em) forwards}
@keyframes drwIn{to{transform:translateX(0)}}
.drw .hd{height:64px;padding:0 8px 0 16px;display:flex;align-items:center;gap:4px;
  font:500 var(--t-title-s);color:var(--fg-v)}
.drw .bd{flex:1;overflow-y:auto;padding:0 12px 16px}
/* MD3 抽屉项：高 56dp 圆角 28dp full-width */
.di{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-radius:var(--r-full);
  font:500 var(--t-label-l);color:var(--on-sv);width:100%;text-align:left;
  position:relative;overflow:hidden;margin-bottom:2px}
.di::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity var(--d-s)}
.di:hover::before{opacity:.08}
.di:active::before{opacity:.10}
.di>*{position:relative}
.di.on{background:var(--p90);color:var(--on-pc)}
.di .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:400}
.dsec{padding:16px 16px 8px;font:500 var(--t-title-s);color:var(--fg-v)}

/* MD3 菜单：锚定触发点，从按钮展开，无居中卡片 */
.menu-layer{position:fixed;inset:0;z-index:250}
.menu{position:absolute;min-width:112px;max-width:min(88vw,280px);padding:8px;
  background:var(--sc-hi);border-radius:var(--r-xs);box-shadow:var(--e2);
  opacity:0;transform:scale(.9);
  transition:opacity var(--d-s) var(--std),transform var(--d-m) var(--em)}
.menu.in{opacity:1;transform:scale(1)}
.mi{display:flex;align-items:center;gap:12px;width:100%;height:48px;padding:0 12px;
  border-radius:var(--r-xs);font:var(--t-label-l);color:var(--fg);text-align:left;
  position:relative;overflow:hidden;white-space:nowrap}
.mi::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity var(--d-s)}
.mi:hover::before{opacity:.08}
.mi:active::before{opacity:.10}
.mi>*{position:relative}
.mi svg{flex:none;color:var(--fg-v)}

/* MD3 对话框：圆角 28dp，缩放淡入 */
.dlg{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.32);padding:24px;animation:scrimIn var(--d-s) var(--std) forwards}
.dlg .box{background:var(--sc-high);border-radius:var(--r-xl);width:min(100%,340px);
  box-shadow:var(--e3);max-height:80vh;display:flex;flex-direction:column;overflow:hidden;
  animation:dlgIn var(--d-m) var(--em)}
@keyframes dlgIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.dlg .h{padding:24px 24px 16px;font:var(--t-title-l);color:var(--fg)}
.dlg .c{padding:0 24px;font:var(--t-body-m);color:var(--fg-v);max-height:50vh;overflow-y:auto;line-height:1.6}
.dlg .f{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px 20px}
.dlg .f .btn{padding:0 12px;min-width:64px}
.dlg input{width:100%;height:56px;padding:0 16px;border:none;border-bottom:1px solid var(--out);
  border-radius:var(--r-xs) var(--r-xs) 0 0;background:var(--sc-hi);color:var(--fg);
  font:var(--t-body-l);outline:none}
.dlg input:focus{border-bottom:2px solid var(--p40)}

/* Snackbar：MD3 高 48dp 圆角 4dp */
#toast{position:fixed;left:16px;right:16px;bottom:16px;background:var(--n100);color:var(--n95);
  padding:14px 16px;border-radius:var(--r-xs);font:var(--t-body-m);z-index:300;
  box-shadow:var(--e3);animation:snackIn var(--d-m) var(--em);display:flex;align-items:center}
[data-theme="night"] #toast{background:var(--n90);color:var(--n10)}
@keyframes snackIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* 设置项 */
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:56px;flex-wrap:wrap}
.row+.row{border-top:1px solid var(--out-v)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .btn{flex:1;min-width:88px}
.sw{width:52px;height:32px;border-radius:var(--r-full);background:var(--sc-high);
  border:2px solid var(--out);position:relative;transition:background var(--d-m) var(--std);
  flex:none;display:flex;align-items:center;padding:0 3px}
.sw i{width:16px;height:16px;border-radius:50%;background:var(--out);display:block;
  transition:all var(--d-m) var(--em)}
.sw.on{background:var(--p40);border-color:var(--p40)}
.sw.on i{width:24px;height:24px;background:var(--on-p);transform:translateX(20px)}
input[type=range]{width:150px;accent-color:var(--p40)}

#crash{position:fixed;left:12px;right:12px;top:12px;z-index:999;background:var(--err);
  color:var(--on-err);padding:14px 16px;border-radius:var(--r-xs);font:var(--t-body-s);
  box-shadow:var(--e2);line-height:1.6}
</style>
</head>
<body>

<!-- ================= 书架 ================= -->
<div id="shelf">
  <div class="appbar" id="shelfBar">
    <h1>LocalReader</h1>
    <button class="ib" onclick="UI.openSettings()" data-ic="settings" title="设置"></button>
  </div>
  <div id="blist" class="blist"></div>
  <div id="empty" class="empty">
    <div data-ic="auto_stories" data-ic-size="64"></div>
    <div class="t">书架空空如也</div>
    <div class="s">点右上角或下方的导入按钮</div>
  </div>
  <button class="fab ext" onclick="pickBook()" data-ic="add" data-ic-text="导入"></button>
</div>

<!-- ================= 分章预览 ================= -->
<div id="preview" class="fp hidden">
  <div class="appbar">
    <button class="ib" onclick="Preview.cancel()" data-ic="close"></button>
    <h1 class="s" id="pvTitle">分章预览</h1>
    <div id="pvCount" style="font:500 var(--t-title-s);padding:0 12px"></div>
  </div>
  <div class="chips" id="pvChips"></div>
  <div class="fld">
    <input id="pvRegex" placeholder="章节正则（留空自动识别）">
    <div id="pvErr" class="err hidden"></div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:12px">
      <button class="btn sm tonal" onclick="Preview.applyCustom()">应用</button>
      <button class="btn sm outlined" onclick="Preview.applyRule('auto')">自动识别</button>
      <span style="flex:1"></span>
      <span id="pvMode" style="font:var(--t-label-s);color:var(--fg-v)"></span>
    </div>
    <div id="pvSample" style="font:var(--t-label-s);color:var(--fg-v);margin-top:6px"></div>
  </div>
  <div class="lst" id="pvList"></div>
  <div class="btmb">
    <button class="btn outlined" style="flex:1" onclick="Preview.cancel()">取消</button>

let db = null;
function openDB(){
  return new Promise((res, rej) => {
    let idb;
    try { idb = indexedDB; } catch (e) { return rej(new Error('IndexedDB 不可用')); }
    if (!idb) return rej(new Error('IndexedDB 不可用'));
    let r;
    try { r = idb.open('localreader', 3); }
    catch (e) { return rej(e); }
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('books')) d.createObjectStore('books', {keyPath:'id'});
    };
    r.onsuccess = e => { db = e.target.result; res(db); };
    r.onerror = () => rej(new Error('IndexedDB 打开失败'));
    r.onblocked = () => rej(new Error('IndexedDB 被阻塞'));
  });
}
const st = m => db.transaction('books', m).objectStore('books');
const idbPut = o => new Promise((res, rej) => { const r = st('readwrite').put(o); r.onsuccess = res; r.onerror = rej; });
const idbAll = () => new Promise((res, rej) => { const r = st().getAll(); r.onsuccess = () => res(r.result); r.onerror = rej; });
const idbGet = id => new Promise((res, rej) => { const r = st().get(id); r.onsuccess = () => res(r.result); r.onerror = rej; });

/* ============================ 统一存储层 ============================ */
const Store = {
  mode: 'mem',
  mem: new Map(),          // 兜底：浏览器不给存储时的内存库，本次会话可用
  async init(){
    // 无论哪一步出问题都必须 resolve，否则书架永远画不出来
    try {
      if (window.lrStore && typeof window.lrStore.list === 'function'){ this.mode = 'fs'; return 'fs'; }
      if (location.protocol === 'http:' || location.protocol === 'https:'){
        try {
          const r = await fetch('api/ping', {cache:'no-store'});
          if (r.ok && (await r.text()).trim() === 'pong'){ this.mode = 'http'; return 'http'; }
        } catch (e) {}
      }
      // 加超时：某些浏览器（如 Edge 的 file://）IndexedDB 可能既不成功也不失败，直接挂住
      await Promise.race([
        openDB(),
        new Promise((_, rej) => setTimeout(() => rej(new Error('IndexedDB 超时')), 3000)),
      ]);
      this.mode = 'idb'; return 'idb';
    } catch (e) {
      this.mode = 'mem'; return 'mem';   // 降级到内存，至少本次能读
    }
  },
  /** 书架数据源：任何情况下都返回数组，绝不给 undefined */
  async all(){
    let r = null;
    try {
      if (this.mode === 'fs') r = await window.lrStore.list();
      else if (this.mode === 'http') r = await (await fetch('api/books')).json();
      else if (this.mode === 'mem') r = [...this.mem.values()];
      else r = await idbAll();
    } catch (e) { r = null; }
    return Array.isArray(r) ? r : [];
  },
  async get(id){
    if (this.mode === 'fs') return window.lrStore.get(id);
    if (this.mode === 'http') return (await fetch('api/books/' + encodeURIComponent(id))).json();
    if (this.mode === 'mem') return this.mem.has(id) ? JSON.parse(JSON.stringify(this.mem.get(id))) : null;
    return idbGet(id);
  },
  async put(b){
    if (this.mode === 'fs') return window.lrStore.put(b);
    if (this.mode === 'http'){
      await fetch('api/books/' + encodeURIComponent(b.id), {
        method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b)});
      return true;
    }
    if (this.mode === 'mem'){ this.mem.set(b.id, JSON.parse(JSON.stringify(b))); return true; }
    return idbPut(b);
  },
  async del(id){
    if (this.mode === 'fs') return window.lrStore.del(id);
    if (this.mode === 'http'){ await fetch('api/books/' + encodeURIComponent(id), {method:'DELETE'}); return true; }
    if (this.mode === 'mem'){ this.mem.delete(id); return true; }
    return idbDel(id);
  },
  async dir(){
    if (this.mode === 'fs') return window.lrStore.dir();
    if (this.mode === 'http'){ try { return (await fetch('api/dir')).text(); } catch (e) { return ''; } }
    return '';
  },
  async openDir(){ if (this.mode === 'fs' && window.lrStore.openDir) window.lrStore.openDir(); },
  /** 是否会把书保留到下次打开 */
  persistent(){ return this.mode === 'fs' || this.mode === 'http' || this.mode === 'idb'; }
};

/* ============================ 编码探测 ============================ */
function decodeUtf16(bytes, big){
  let out = '', buf = [];
  for (let i = 0; i + 1 < bytes.length; i += 2){
    buf.push(big ? ((bytes[i] << 8) | bytes[i + 1]) : ((bytes[i + 1] << 8) | bytes[i]));
    if (buf.length === 4096){ out += String.fromCharCode.apply(null, buf); buf = []; }
  }
  out += String.fromCharCode.apply(null, buf);
  return out;
}
/** BOM → UTF-16 → UTF-8 严格 → GBK → UTF-8 容错 */
function decodeBytes(buf){
  const b = new Uint8Array(buf);
  if (!b.length) return '';
  if (b.length >= 3 && b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF)
    return new TextDecoder('utf-8').decode(b.subarray(3));
  if (b.length >= 2){
    if (b[0] === 0xFF && b[1] === 0xFE) return decodeUtf16(b.subarray(2), false);
    if (b[0] === 0xFE && b[1] === 0xFF) return decodeUtf16(b.subarray(2), true);
  }
  try { return new TextDecoder('utf-8', {fatal:true}).decode(b); } catch (e) {}
  try { const g = new TextDecoder('gbk').decode(b); if (g) return g; } catch (e) {}
  return new TextDecoder('utf-8').decode(b);
}

function cleanTitle(raw){
  if (raw == null) return '未命名';
  const t = String(raw).replace(/\s+/g, ' ').trim();
  if (!t) return '未命名';
  return t.length > 40 ? t.slice(0, 40) + '…' : t;
}
function firstLineTitle(content, end){
  const head = content.slice(0, clamp(end, 0, content.length));
  for (const line of head.split(/\r\n|\r|\n/)){
    const t = line.trim();
    if (t) return t.length > 20 ? t.slice(0, 20) + '…' : t;
  }
  return '开始';
}
function splitByPattern(content, pattern, ruleId, mode){

    if (firstMatch < 0) firstMatch = m.index;
    offsets.push(m.index);

    if (offsets.length > 20000) break;
  }
  if (!offsets.length || offsets[0] !== 0){
    offsets.unshift(0);
    titles.unshift(firstLineTitle(content, offsets.length > 1 ? offsets[1] : content.length));
  }
  return {offsets, titles, pattern, ruleId: ruleId || null, mode: mode || 'pattern', firstMatch};
}
function scoreSplit(content, split){
  const n = split.offsets.length;
  if (n < 3) return 0;
  const avgLen = content.length / n;
  let lenScore;
  if (avgLen >= 500 && avgLen <= 20000) lenScore = 1;
  else if (avgLen < 500) lenScore = avgLen / 500;
  else lenScore = 20000 / avgLen;
  let total = 0;
  for (const t of split.titles) total += t.length;
  const avgTitle = total / n;
  const titleScore = avgTitle <= 30 ? 1 : Math.max(0.05, 30 / avgTitle);
  const firstHit = (split.firstMatch != null && split.firstMatch >= 0)
      ? split.firstMatch : (n > 1 ? split.offsets[1] : content.length);
  const headScore = firstHit > content.length * 0.25 ? 0.3 : 1;
  return lenScore * titleScore * headScore * Math.min(1, n / 20);
}
function autoDetectChapters(content){
  let best = null, bestScore = 0;
  for (const rule of kPresetRules){
    const s = splitByPattern(content, rule.pattern, rule.id, 'auto');
    const sc = scoreSplit(content, s);
    if (sc > bestScore){ bestScore = sc; best = s; }
  }
  if (!best || bestScore <= 0.05) return splitByLength(content);
  return best;
}
function splitByLength(content, target, hard){
  target = target || 5000; hard = hard || 12000;
  const offsets = [0], titles = ['开始'];
  let start = 0, index = 1;
  while (start < content.length){
    const end = start + target;
    if (end >= content.length) break;
    const limit = Math.min(content.length, start + hard);
    const nl = content.indexOf('\n', end);
    const cut = (nl < 0 || nl + 1 > limit) ? limit : nl + 1;
    if (cut <= start || cut >= content.length) break;
    offsets.push(cut); titles.push('第 ' + index + ' 段'); index++; start = cut;
  }
  return {offsets, titles, pattern:null, ruleId:null, mode:'length', firstMatch:-1};
}

/* ==========================================================================
   EPUB 解析（含内嵌插图）
   ========================================================================== */
const IMG_BUDGET = 260, IMG_MAX_W = 1100;

function baseDir(p){ const i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i); }
function resolvePath(base, href){ return base ? base + '/' + href : href; }
async function zipText(zip, path){
  let f = zip.file(path);
  if (!f){ try { f = zip.file(decodeURIComponent(path)); } catch (e) {} }
  if (!f){
    const hit = Object.keys(zip.files).find(n => n.toLowerCase() === path.toLowerCase()
      || n.toLowerCase().endsWith('/' + path.toLowerCase()));
    if (hit) f = zip.file(hit);
  }
  return f ? await f.async('string') : null;
}
/** 图片压缩：缩放 + 白底转 JPEG */
function compressImage(dataUrl, maxW){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth || 600, h = img.naturalHeight || 800;
      if (w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
      try {
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const g = c.getContext('2d');
        g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
        g.drawImage(img, 0, 0, w, h);
        res({src: c.toDataURL('image/jpeg', 0.82), w, h});
      } catch (e) { res(null); }
    };
    img.onerror = () => res(null);
    img.src = dataUrl;
  });
}
function extMime(p){
  const e = (p.split('.').pop() || '').toLowerCase();
  if (e === 'png') return 'image/png';
  if (e === 'gif') return 'image/gif';
  if (e === 'webp') return 'image/webp';
  return 'image/jpeg';
}
/** 把 HTML 拆成块：文本块存纯文本，图片块存压缩后的 dataURL */
async function htmlToBlocks(html, zip, base, budget){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,svg,iframe,object,noscript').forEach(n => n.remove());
  const flat = [];
  (function walk(node){
    for (const child of [...node.childNodes]){
      if (child.nodeType === 3){ if (child.textContent.trim()) flat.push(['text', child.textContent]); }
      else if (child.nodeType === 1){
        const tag = child.tagName.toLowerCase();
        if (tag === 'img') flat.push(['img', child]);
        else if (/^(p|div|h[1-6]|li|blockquote|pre|section|article|figure|td|tr)$/.test(tag)){
          if (child.querySelector('img,p,div')) walk(child);
          else flat.push(['el', child]);
        }
        else walk(child);
      }
    }
  })(doc.body || doc);

  const blocks = [];
  for (const [kind, node] of flat){
    if (kind === 'img'){
      if (budget.used >= IMG_BUDGET){ blocks.push({t:'ph', text:'［图片已省略］'}); continue; }
      const src = (node.getAttribute('src') || '').trim();
      if (!src || src.startsWith('data:')) continue;
      const p = resolvePath(base, src.split('?')[0]);
      const f = zip.file(p) || zip.file(decodeURIComponent(p));
      if (!f) continue;
      try {
        const raw = await f.async('base64');
        const cp = await compressImage('data:' + extMime(p) + ';base64,' + raw, IMG_MAX_W);
        if (!cp) continue;
        budget.used++;
        blocks.push({t:'img', src:cp.src, w:cp.w, hh:cp.h});
      } catch (e) {}
    } else {
      const text = (kind === 'text' ? node : node.textContent || '').replace(/\s+/g, ' ').trim();
      if (!text) continue;
      const tag = kind === 'el' ? node.tagName.toLowerCase() : 'p';
      blocks.push(/^h[1-6]$/.test(tag) ? {t:'h', text} : {t:'text', text});
    }
  }
  return blocks;
}
function htmlToPlain(html){
  let s = html.replace(/<(script|style)\b[\s\S]*?<\/\1>/gi, '');
  s = s.replace(/<br\s*\/?>/gi, '\n');
  s = s.replace(/<\/(p|div|h[1-6]|li|tr|blockquote)>/gi, '\n');
  const d = document.createElement('div');
  d.innerHTML = s;
  let t = (d.textContent || '').replace(/ /g, ' ');
  return t.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
}

async function parseEpub(buf){
  const zip = await JSZip.loadAsync(buf);
  const container = await zipText(zip, 'META-INF/container.xml');
  if (!container) throw new Error('缺少 META-INF/container.xml，不是有效 EPUB');
  const mm = container.match(/full-path\s*=\s*"([^"]+)"/);
  const opfPath = mm ? mm[1] : 'OEBPS/content.opf';
  const opfText = await zipText(zip, opfPath);
  if (!opfText) throw new Error('找不到 opf 文件');
  const opf = new DOMParser().parseFromString(opfText, 'application/xml');
  const base = baseDir(opfPath);
  const strip = s => s.replace(/<[^>]*>/g, '');
  const firstText = n => {
    for (const e of opf.getElementsByTagName('*')){
      if ((e.localName || e.nodeName) !== n) continue;
      const t = (e.textContent || '').trim();
      if (t) return t;
    }
    return null;
  };
  const desc = firstText('description');
  const meta = {title: firstText('title') || '未命名', author: firstText('creator') || '',
                description: desc ? strip(desc) : ''};

  const manifest = {};
  for (const it of opf.getElementsByTagName('item')){
    const id = it.getAttribute('id'), href = it.getAttribute('href');
    if (!id || !href) continue;
    manifest[id] = {href, type: it.getAttribute('media-type') || '', props: it.getAttribute('properties') || ''};
  }
  const order = [];
  for (const r of opf.getElementsByTagName('itemref')){
    const id = r.getAttribute('idref');
    if (id && manifest[id]) order.push(id);
  }
  if (!order.length) order.push(...Object.keys(manifest));

  const navLabel = {};
  const navItem = Object.values(manifest).find(x => /\bnav\b/.test(x.props));
  if (navItem){
    const navHtml = await zipText(zip, resolvePath(base, navItem.href));
    if (navHtml){
      const nd = new DOMParser().parseFromString(navHtml, 'text/html');
      const nav = nd.querySelector('nav') || nd;
      for (const a of nav.querySelectorAll('a')){
        const h = (a.getAttribute('href') || '').split('#')[0];
        if (h) navLabel[resolvePath(base, h)] = a.textContent.trim();
      }
    }
  }
  let coverId = null;
  for (const m of opf.getElementsByTagName('meta')){
    if (m.getAttribute('name') === 'cover') coverId = m.getAttribute('content');
  }
  let coverHref = null;
  for (const it of Object.values(manifest)) if (it.props.includes('cover-image')){ coverHref = it.href; break; }
  if (!coverHref && coverId && manifest[coverId]) coverHref = manifest[coverId].href;
  if (coverHref){
    const cf = zip.file(resolvePath(base, coverHref));
    if (cf){ try { meta.cover = 'data:' + extMime(coverHref) + ';base64,' + await cf.async('base64'); } catch (e) {} }
  }

  let content = '';
  const offsets = [], titles = [], blocks = [];
  const budget = {used: 0};
  let seen = 0;
  for (const id of order){
    const it = manifest[id];
    const isHtml = /html|xhtml/.test(it.type) || /\.(x?html?|htm)$/i.test(it.href);
    if (!isHtml) continue;
    const p = resolvePath(base, it.href);
    const html = await zipText(zip, p);
    if (html == null) continue;
    const plain = htmlToPlain(html);
    if (!plain.trim()) continue;
    seen++;
    const hm = html.match(/<h[1-4][^>]*>([\s\S]*?)<\/h[1-4]>/i) || html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    const label = navLabel[p] || (hm ? cleanTitle(strip(hm[1])) : null) || ('第 ' + seen + ' 节');
    offsets.push(content.length);
    titles.push(label);
    const bl = await htmlToBlocks(html, zip, base, budget);
    let cursor = content.length;
    for (const b of bl){
      const len = b.t === 'text' || b.t === 'h' ? b.text.replace(/\s/g, '').length : 0;
      b.s = cursor; b.e = cursor + len; cursor += len;
      blocks.push(b);
    }
    content += plain + '\n\n';
  }
  if (!offsets.length || offsets[0] !== 0){ offsets.unshift(0); titles.unshift('开始'); }
  return {content, offsets, titles, blocks, meta, mode:'epub'};
}

/* ==========================================================================
   数据模型：content 永不改动，目录 = offsets + titles
   blocks 记录每块在 content 中的 [s,e)，用于插图渲染与搜索定位
   ========================================================================== */
function chapterRange(book, i){
  const s = book.offsets[i] || 0;
  const e = i + 1 < book.offsets.length ? book.offsets[i + 1] : book.content.length;
  return [s, e];
}
function blocksOfChapter(book, i){
  const [s, e] = chapterRange(book, i);
  const out = [];
  for (const b of book.blocks){
    // 图片/占位块长度为 0（正文里没有对应字符），只能按起点判断归属
    if (!b.e || b.e <= b.s){
      if (b.s < s || b.s >= e) continue;
      out.push(b);
      continue;
    }
    if (b.e <= s) continue;
    if (b.s >= e) break;
    out.push(b);
  }
  if (!out.length) out.push({t:'text', text:'(本章无内容)', s, e});
  return out;
}
function removeChapter(book, i){
  if (i < 0 || i >= book.offsets.length || book.offsets.length <= 1) return false;
  if (i === 0) book.offsets[1] = 0;
  book.offsets.splice(i, 1);
  if (i < book.titles.length) book.titles.splice(i, 1);
  return true;
}
function pctOf(book){
  const n = book.offsets.length;
  if (!n) return 0;
  const p = book.progress || {};
  return clamp(Math.round(((p.ci || 0) + (p.ratio || 0)) / n * 100), 0, 100);
}
/* TXT：按段落建块 */
function txtBlocks(content){
  const blocks = [];
  let cursor = 0;
  for (const line of content.split(/\r?\n/)){
    const t = line.trim();
    if (t) blocks.push({t:'text', text:t, s:cursor, e:cursor + t.length});
    cursor += line.length + 1;
  }
  if (!blocks.length) blocks.push({t:'text', text:content, s:0, e:content.length});
  return blocks;
}

/* ==========================================================================
   分页：开源阅读器算法 —— 字符级精确填充 + 逐行推进
   全部基于真实排版测量（字号 / 行距 / 页宽 / 屏幕高度），不靠估算
   ========================================================================== */
/* 标点避头尾：这些不能出现在行首 / 行尾 */
const TAIL_SET = '。！？，、；：）」』”’…》】〉·';
const HEAD_SET = '（「『“‘《【〈';

const Pager = {
  m:null, contentW:0, availH:0, lineH:0, gap:0, cpl:30, titleH:0,

  /** 依据当前屏幕与排版设置建立测量环境 */
  setup(stage){
    const d = Settings.data;
    const W = stage.clientWidth, H = stage.clientHeight;
    this.contentW = Math.max(120, Math.min(W - 40, d.w));
    this.availH = Math.max(60, H - d.pad * 2);
    this.lineH = d.fs * d.lh;
    this.gap = Math.round(d.fs * 0.85);      // 段间距，与 CSS 中 p 的 margin-bottom 一致
    this.m = $('#meas');
    this.m.style.width = this.contentW + 'px';
    this.cpl = this.measureCPL();
  },

  /** 每行大约能放多少个字（用于孤行判断与二分起点） */
  measureCPL(){
    const probe = '测测测测测测测测测测测测测测测测测测测测';
    this.m.innerHTML = '<p class="np">' + probe + '</p>';
    const el = this.m.firstElementChild;
    const w = el ? el.getBoundingClientRect().width : 0;
    if (!w) return 30;
    return clamp(Math.floor(this.contentW / (w / probe.length)), 6, 200);
  },

  /** 一段文本的实际渲染高度（真实排版，非估算） */
  h(text, indent){
    this.m.innerHTML = '<p' + (indent ? '' : ' class="np"') + '>' + esc(text) + '</p>';
    const el = this.m.firstElementChild;
    return el ? el.getBoundingClientRect().height : this.lineH;
  },
  lines(text, indent){ return Math.max(1, Math.round(this.h(text, indent) / this.lineH)); },

  /** 二分：给定高度上限，最多能放多少个字符 */
  maxFit(text, avail, indent){
    const len = text.length;
    if (!len) return 0;
    if (this.h(text, indent) <= avail) return len;
    // 先用「行数 × 每行字数」粗估，把二分区间缩小到一侧
    let guess = clamp(Math.floor(avail / this.lineH) * this.cpl, 1, len);
    let lo, hi, best;
    if (this.h(text.slice(0, guess), indent) <= avail){ lo = guess; hi = len; best = guess; }
    else { lo = 1; hi = guess - 1; best = 0; }
    while (lo <= hi){
      const mid = (lo + hi) >> 1;
      if (this.h(text.slice(0, mid), indent) <= avail){ best = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return best;
  },

  /** text.slice(0,k) 渲染后，最后一行的起始下标（用于孤行控制） */
  lastLineStart(text, k, indent){
    const L = this.lines(text.slice(0, k), indent);
    if (L <= 1) return 0;
    let lo = 1, hi = k - 1, best = 0;
    while (lo <= hi){
      const mid = (lo + hi) >> 1;
      if (this.lines(text.slice(0, mid), indent) <= L - 1){ best = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return best;
  },

  /** 把一章切成若干页，每页都尽量填满 */
  paginate(book, ci){
    const stage = $('#stage');
    this.setup(stage);
    const title = book.titles[ci] || ('第 ' + (ci + 1) + ' 章');
    this.m.innerHTML = '<h3>' + esc(title) + '</h3>';
    const te = this.m.firstElementChild;
    this.titleH = (te ? te.getBoundingClientRect().height : 0) + this.gap;

    const blocks = blocksOfChapter(book, ci);
    const pages = [];
    let cur = [], curH = 0;
    const flush = () => { if (cur.length){ pages.push({segs:cur, s:cur[0].s}); cur = []; curH = 0; } };
    /** 本页剩余可用高度（首页要给章名留位置） */
    const avail = () => this.availH - curH - (pages.length === 0 ? this.titleH : 0);
    const maxImgH = Math.max(60, this.availH - 10);

    for (const b of blocks){
      if (b.t === 'img'){
        const dispW = Math.min(this.contentW, b.w || this.contentW);
        let dispH = Math.round(dispW * (b.hh || 600) / (b.w || 600));
        if (dispH > maxImgH) dispH = maxImgH;
        const need = dispH + 8 + this.gap;
        if (cur.length && this.gap + need > avail()) flush();
        curH += (cur.length ? this.gap : 0) + need;
        cur.push({t:'img', src:b.src, maxH:maxImgH, s:b.s, e:b.s});
        continue;
      }
      const text = b.t === 'ph' ? b.text : b.text;
      let rest = text || '';
      let head = true;                 // 是否为段首（决定首行缩进）
      let guard = 0;
      while (rest && guard++ < 900){
        const room = avail() - (cur.length ? this.gap : 0);
        if (room < this.lineH && cur.length){ flush(); continue; }
        let n = this.maxFit(rest, room, head);
        if (n <= 0){
          if (cur.length){ flush(); continue; }
          n = 1;                       // 空页连一行都放不下（极端窄屏），强行推进
        }
        // 孤行控制：最后一行太短，就把这整行推到下一页，避免出现「只剩一个字符」
        if (n < rest.length){
          const ls = this.lastLineStart(rest, n, head);
          if (ls > 0 && (n - ls) < this.cpl * 0.35) n = ls;
        }
        // 避头尾标点
        if (n < rest.length && TAIL_SET.includes(rest[n])) n++;
        if (n > 1 && HEAD_SET.includes(rest[n - 1])) n--;
        n = clamp(n, 1, rest.length);

        const seg = rest.slice(0, n);
        const sIdx = (b.s || 0) + ((text || '').length - rest.length);
        curH += (cur.length ? this.gap : 0) + this.h(seg, head);
        cur.push({t:'text', text:seg, indent:head, s:sIdx, e:sIdx + seg.length});
        rest = rest.slice(n);
        head = false;
        if (rest) flush();             // 本页满了，剩下的去下一页
      }
    }
    flush();
    if (!pages.length) pages.push({segs:[{t:'text', text:'', indent:true, s:0, e:0}], s:0});
    this.m.innerHTML = '';
    return pages;
  },

  /** 一页 → HTML */
  html(page, title, isFirst){
    let out = isFirst ? '<h3>' + esc(title) + '</h3>' : '';
    for (const s of page.segs){
      if (s.t === 'img') out += '<img src="' + s.src + '" style="max-height:' + s.maxH + 'px">';
      else if (s.t === 'ph') out += '<div class="ph">' + esc(s.text) + '</div>';
      else out += '<p' + (s.indent ? '' : ' class="np"') + '>' + esc(s.text) + '</p>';
    }
    return '<div class="in">' + out + '</div>';
  }
};

/* ==========================================================================
   翻页控制器：跟手、可停在半路、正反两个方向都有动画
   ========================================================================== */
const EASE = 'cubic-bezier(.2,0,0,1)';

const Flip = {
  active:false, dir:1, prog:0, old:null, neu:null, shade:null, stage:null,
  tci:0, tpi:0, tPages:null, busy:false,

  begin(dir){
    if (this.active) this.end();
    const b = Reader.book;
    if (!b) return false;
    let tci = Reader.ci, tpi = Reader.pi + dir, tPages = Reader.pages;
    if (tpi >= Reader.pages.length){
      if (Reader.ci + 1 >= b.offsets.length) return false;
      tci = Reader.ci + 1; tPages = Reader.pagesOf(tci); tpi = 0;
    } else if (tpi < 0){
      if (Reader.ci <= 0) return false;
      tci = Reader.ci - 1; tPages = Reader.pagesOf(tci); tpi = tPages.length - 1;
    }
    const stage = this.stage = $('#stage');
    const old = stage.querySelector('.page.cur');
    if (!old) return false;

    this.dir = dir; this.prog = 0;
    this.tci = tci; this.tpi = tpi; this.tPages = tPages;
    this.old = old;

    const neu = document.createElement('div');
    neu.className = 'page neu';
    neu.innerHTML = Reader.pageHTML(tpi, tci, tPages);
    old.style.zIndex = dir > 0 ? 2 : 1;
    neu.style.zIndex = dir > 0 ? 1 : 2;
    stage.appendChild(neu);
    this.neu = neu;

    const sh = document.createElement('div');
    sh.className = 'shade';
    (dir > 0 ? old : neu).appendChild(sh);
    this.shade = sh;

    this.active = true;
    this.update(0);
    return true;
  },

  /** prog: 0 = 未翻，1 = 翻完。手指停住不动就一直停在中间 */
  update(p){
    if (!this.active) return;
    this.prog = clamp(p, 0, 1);
    const d = Settings.data, p2 = this.prog;
    if (d.flip === '3d'){
      if (this.dir > 0){
        this.old.style.transformOrigin = 'left center';
        this.old.style.transform = 'rotateY(' + (-p2 * 180) + 'deg)';
      } else {
        this.neu.style.transformOrigin = 'right center';
        this.neu.style.transform = 'rotateY(' + ((1 - p2) * 180) + 'deg)';
      }
      this.shade.style.opacity = String(Math.min(0.5, (this.dir > 0 ? p2 : 1 - p2) * 0.6));
    } else {
      if (this.dir > 0){
        this.old.style.transform = 'translateX(' + (-p2 * 100) + '%)';
        this.neu.style.transform = 'translateX(' + ((1 - p2) * 100) + '%)';
      } else {
        this.neu.style.transform = 'translateX(' + (-(1 - p2) * 100) + '%)';
        this.old.style.transform = 'translateX(' + (p2 * 30) + '%)';
      }
    }
  },

  /** 完成翻页：动画到终点后提交状态 */
  commit(){
    if (!this.active) return;
    const d = Settings.data;
    const dur = d.anim ? (d.flip === '3d' ? 420 : 300) : 0;
    const o = this.old, n = this.neu, dir = this.dir;
    const set = (el, t) => {
      el.style.transition = dur ? 'transform ' + dur + 'ms ' + EASE : 'none';
      el.style.transform = t;
    };
    if (d.flip === '3d'){
      if (dir > 0){ set(o, 'rotateY(-180deg)'); set(n, 'rotateY(0deg)'); }
      else { set(n, 'rotateY(0deg)'); set(o, 'none'); }
    } else {
      if (dir > 0){ set(o, 'translateX(-100%)'); set(n, 'translateX(0)'); }
      else { set(n, 'translateX(0)'); set(o, 'translateX(30%)'); }
    }
    if (this.shade) this.shade.style.transition = 'opacity ' + dur + 'ms linear';
    if (this.shade) this.shade.style.opacity = dir > 0 ? '0.5' : '0';
    setTimeout(() => this.end(true), dur + 30);
  },

  /** 取消：回弹到原页 */
  cancel(){
    if (!this.active) return;
    const d = Settings.data;
    const dur = d.anim ? (d.flip === '3d' ? 300 : 220) : 0;
    const o = this.old, n = this.neu, dir = this.dir;
    const set = (el, t) => {
      el.style.transition = dur ? 'transform ' + dur + 'ms ' + EASE : 'none';
      el.style.transform = t;
    };
    if (d.flip === '3d'){
      if (dir > 0) set(o, 'rotateY(0deg)');
      else set(n, 'rotateY(180deg)');
    } else {
      if (dir > 0){ set(o, 'translateX(0)'); set(n, 'translateX(100%)'); }
      else { set(n, 'translateX(-100%)'); set(o, 'translateX(0)'); }
    }
    if (this.shade) this.shade.style.opacity = '0';
    setTimeout(() => this.end(false), dur + 30);
  },

  end(done){
    if (!this.active) return;
    if (done){
      if (this.old) this.old.remove();
      if (this.neu){ this.neu.className = 'page cur'; this.neu.style.cssText = ''; }
      Reader.ci = this.tci; Reader.pages = this.tPages; Reader.pi = this.tpi;
    } else {
      if (this.neu) this.neu.remove();
      if (this.old){ this.old.style.cssText = ''; this.old.className = 'page cur'; }
    }
    if (this.shade) this.shade.remove();
    this.active = false; this.busy = false;
    this.old = this.neu = this.shade = null;
    Reader.after();
  },

  /** 连翻时立即结束上一次动画 */
  finishNow(){ if (this.active){ this.end(true); } }
};

/* ==========================================================================
   阅读器
   ========================================================================== */
const Reader = {
  book:null, ci:0, pages:[], pi:0, cache:new Map(), _t:null,

  async open(id){
    const b = await Store.get(id);
    if (!b) return;
    this.book = b;
    this.cache.clear();
    const p = b.progress || {};
    this.ci = clamp(p.ci || 0, 0, b.offsets.length - 1);
    const anchor = p.pos != null ? p.pos : (b.offsets[this.ci] || 0);
    $('#shelf').classList.add('hidden');
    $('#reader').classList.remove('hidden');
    $('#rTitle').textContent = b.title;
    b.lastRead = Date.now();
    this.render(anchor);
  },

  /** 某章的页数组（带缓存，尺寸/排版变化自动失效） */
  pagesOf(ci){
    const stage = $('#stage');
    const d = Settings.data;
    const key = [ci, d.fs, d.lh, d.w, d.pad, stage.clientWidth, stage.clientHeight].join('|');
    if (this.cache.has(key)) return this.cache.get(key);
    const pages = Pager.paginate(this.book, ci);
    if (this.cache.size > 8) this.cache.delete(this.cache.keys().next().value);
    this.cache.set(key, pages);
    return pages;
  },

  /** 整页 HTML（含章名与页码） */
  pageHTML(pi, ci, pages){
    const page = pages[pi];
    const b = this.book;
    const title = b.titles[ci] || ('第 ' + (ci + 1) + ' 章');
    return Pager.html(page, title, pi === 0)
      + '<div class="chapname">' + esc(title) + '</div>'
      + '<div class="pgnum">' + (pi + 1) + ' / ' + pages.length + '</div>';
  },

  /** 定位到 anchor 所在页并渲染 */
  render(anchor){
    const stage = $('#stage');
    if (!stage.clientHeight){
      requestAnimationFrame(() => this.render(anchor));
      return;
    }
    this.pages = this.pagesOf(this.ci);
    let idx = 0;
    if (anchor != null){
      for (let i = 0; i < this.pages.length; i++){
        if (this.pages[i].s <= anchor) idx = i; else break;
      }
    }
    this.pi = clamp(idx, 0, this.pages.length - 1);
    Flip.finishNow();
    stage.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'page cur';
    el.innerHTML = this.pageHTML(this.pi, this.ci, this.pages);
    stage.appendChild(el);
    this.after();
  },

  after(){
    if (!this.book) return;
    this.save();
  },

  turn(d){
    if (!this.book) return;
    Flip.finishNow();
    if (Flip.begin(d)) Flip.commit();
  },

  showChapter(ci, pos){
    this.ci = clamp(ci, 0, this.book.offsets.length - 1);
    Flip.finishNow();
    this.render(pos != null ? pos : null);
    if (pos != null) toast('已跳转到搜索结果');
  },

  jumpChapter(i){
    this.ci = clamp(i, 0, this.book.offsets.length - 1);
    Flip.finishNow();
    this.render(null);
    UI.closeDrawer();
  },

  relayout(){
    if (!this.book) return;
    Flip.finishNow();
    this.cache.clear();
    const pos = this.pages[this.pi] ? this.pages[this.pi].s : null;
    this.render(pos);
  },

  save(){
    const b = this.book;
    if (!b || !this.pages.length) return;
    b.progress = {ci:this.ci, ratio:this.pi / this.pages.length,
                  pos:this.pages[this.pi] ? this.pages[this.pi].s : 0};
    b.lastRead = Date.now();
    clearTimeout(this._t);
    this._t = setTimeout(() => Store.put(b), 500);
  },

  async close(){
    clearTimeout(this._t);
    Flip.finishNow();
    this.save();
    if (this.book) await Store.put(this.book);
    $('#reader').classList.add('hidden');
    $('#shelf').classList.remove('hidden');
    renderShelf();
  },

  bookmark(){
    const b = this.book;
    b.bookmarks = b.bookmarks || [];
    const pos = this.pages[this.pi] ? this.pages[this.pi].s : 0;
    const cur = {ci:this.ci, pos, label:b.titles[this.ci] || ('第 ' + (this.ci + 1) + ' 章'),
                 at:new Date().toLocaleString()};
    const hit = b.bookmarks.findIndex(x => x.ci === cur.ci && Math.abs((x.pos || 0) - pos) < 60);
    if (hit >= 0){ b.bookmarks.splice(hit, 1); toast('已取消书签'); }
    else { b.bookmarks.push(cur); toast('已添加书签'); }
    Store.put(b);
  },

  gotoBookmark(ci, pos){
    UI.closeDrawer();
    this.showChapter(ci, pos);
  },

  openToc(){
    const b = this.book;
    let html = '';
    if (b.bookmarks && b.bookmarks.length){
      html += '<div class="dsec">书签</div>' + b.bookmarks.map(x =>
        `<button class="di" onclick="Reader.gotoBookmark(${x.ci},${x.pos || 0})">${ic('bookmark',24)}<span class="nm">${esc(x.label)}</span></button>`).join('');
      html += '<div class="dsec">目录</div>';
    }
    html += b.titles.map((t, i) =>
      `<button class="di ${i === this.ci ? 'on' : ''}">${ic('article',24)}<span class="nm" onclick="Reader.jumpChapter(${i})">${esc(t || ('第 ' + (i + 1) + ' 章'))}</span>
       <button class="ib" onclick="chapterMenu(event,${i})" style="width:40px;height:40px">${ic('more_vert',24)}</button></button>`).join('');
    UI.drawer('目录 · ' + b.offsets.length + ' 章', html);
  },

  openSet(){
    const s = Settings.data;
    UI.drawer('阅读设置', `
      <div class="dsec">翻页</div>
      <div class="row"><div class="seg">
        <button class="btn sm ${s.flip === 'smooth' ? 'filled' : 'outlined'}" onclick="Settings.data.flip='smooth';Settings.save();Reader.openSet()">平滑</button>
        <button class="btn sm ${s.flip === '3d' ? 'filled' : 'outlined'}" onclick="Settings.data.flip='3d';Settings.save();Reader.openSet()">3D 纸张</button>
      </div></div>
      <div class="row"><span style="flex:1;font:var(--t-body-m)">翻页动画</span>
        <div class="sw ${s.anim ? 'on' : ''}" onclick="Settings.data.anim=!Settings.data.anim;Settings.save();Reader.openSet()"><i></i></div></div>
      <div class="dsec">排版</div>
      <div class="row"><span style="flex:1;font:var(--t-body-m)">字号</span>
        <button class="btn sm outlined" onclick="Settings.data.fs=Math.max(13,Settings.data.fs-1);Settings.save();Reader.relayout()">A-</button>
        <b style="min-width:32px;text-align:center;font:500 var(--t-label-l)">${s.fs}</b>
        <button class="btn sm outlined" onclick="Settings.data.fs=Math.min(32,Settings.data.fs+1);Settings.save();Reader.relayout()">A+</button></div>
      <div class="row"><span style="flex:1;font:var(--t-body-m)">行距</span>
        <input type="range" min="1.4" max="2.6" step="0.1" value="${s.lh}"
          oninput="Settings.data.lh=+this.value;Settings.apply()" onchange="Settings.save();Reader.relayout()"></div>
      <div class="row"><span style="flex:1;font:var(--t-body-m)">页宽</span>
        <input type="range" min="420" max="1100" step="20" value="${s.w}"
          oninput="Settings.data.w=+this.value;Settings.apply()" onchange="Settings.save();Reader.relayout()"></div>
      <div class="row"><span style="flex:1;font:var(--t-body-m)">页边距</span>
        <input type="range" min="10" max="48" step="2" value="${s.pad}"
          oninput="Settings.data.pad=+this.value;Settings.apply()" onchange="Settings.save();Reader.relayout()"></div>
      <div class="dsec">主题</div>
      <div class="row"><div class="seg">${THEMES.map(([v,t]) =>
        `<button class="btn sm ${v === s.theme ? 'filled' : 'outlined'}" onclick="Settings.data.theme='${v}';Settings.save();Reader.openSet()">${t}</button>`).join('')}</div></div>

/* ============================ 导入 ============================ */
/* 多选时排队：确认一本再弹下一本，否则预览会被下一本覆盖导致只导入最后一本 */
let importQueue = [], importing = false;
async function enqueue(list){
  const arr = [...list].filter(f => f && f.size > 0);
  if (!arr.length) return;
  importQueue.push(...arr);
  if (importing) return;
  importing = true;
  while (importQueue.length){
    await importFile(importQueue.shift());
    // importFile 成功后会弹预览，等用户确认/取消
    await new Promise(res => { Preview.onceDone = res; });
  }
  importing = false;
  renderShelf();
}

fileInput.addEventListener('change', e => { enqueue(e.target.files); e.target.value = ''; });
/** 导入入口：只有一个，且不做任何类型过滤 */
function pickBook(){ const f = $('#fileInput'); if (f) { f.value = ''; f.click(); } }

/* 拖拽导入：桌面浏览器直接把书拖进来即可 */
['dragenter','dragover'].forEach(ev =>
  document.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
document.addEventListener('drop', e => {
  e.preventDefault(); e.stopPropagation();
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
    enqueue(e.dataTransfer.files);
  }
});

/**
 * 靠文件内容判断类型，不依赖扩展名。
 * 很多安卓文件管理器给回来的 MIME 不准（甚至没有后缀），
 * 只看文件名会漏掉大量 epub。
 */
function sniff(buf){
  const b = new Uint8Array(buf);
  // ZIP 魔数 PK\x03\x04：epub 本质是 zip
  if (b.length > 3 && b[0] === 0x50 && b[1] === 0x4B && b[2] === 0x03 && b[3] === 0x04) return 'epub';
  if (b.length > 3 && b[0] === 0x50 && b[1] === 0x4B && b[2] === 0x05 && b[3] === 0x06) return 'epub'; // 空 zip
  // 纯文本的兜底：能解出可打印字符就算文本
  try {
    const t = decodeBytes(buf.slice(0, 4096));
    if (t && t.trim()) return 'txt';
  } catch (e) {}
  const nm = (arguments[1] || '').toLowerCase();
  if (nm.endsWith('.epub')) return 'epub';
  return 'txt';
}

async function importFile(file){
  try {
    const buf = await file.arrayBuffer();
    if (!buf || !buf.byteLength) throw new Error('文件是空的，或没有读取权限');
    const kind = sniff(buf, file.name || '');

    if (kind === 'epub'){
      if (typeof JSZip === 'undefined') throw new Error('EPUB 解析模块未加载，请重新打开页面');
      toast('正在解析 EPUB…');
      const p = await parseEpub(buf);
      if (!p.content.trim()) throw new Error('这个 EPUB 里没读到正文');
      Preview.open({
        content: p.content,
        split: {offsets:p.offsets, titles:p.titles, pattern:null, ruleId:null, mode:'epub', firstMatch:-1},
        blocks: p.blocks,
        title: p.meta.title || file.name.replace(/\.epub$/i, ''),
        author: p.meta.author, description: p.meta.description,
        cover: p.meta.cover, sourceType:'epub', size:file.size, editable:false
      });
    } else {
      const content = decodeBytes(buf);
      if (!content.trim()) throw new Error('没读到文本内容');
      const split = autoDetectChapters(content);
      Preview.open({
        content, split, blocks: txtBlocks(content),
        title: (file.name || '未命名').replace(/\.(txt|text|epub)$/i, ''),
        author:'', description:'',
        cover:null, sourceType:'txt', size:file.size, editable:true
      });
    }
  } catch (err){ toast('导入失败：' + err.message); }
}

/* ============================ 分章预览 ============================ */
const Preview = {
  st:null, split:null, ruleId:'auto',
  open(o){
    this.st = o; this.split = o.split;
    this.ruleId = o.editable ? 'auto' : 'epub';
    $('#pvTitle').textContent = '分章预览 · ' + o.title;
    $('#pvRegex').value = o.split.pattern || '';
    $('#pvErr').classList.add('hidden');
    this.chips(); this.render();
    $('#preview').classList.remove('hidden');
  },
  chips(){
    const head = this.st.editable
      ? [{id:'auto', name:'自动识别'}]
      : [{id:'epub', name:'EPUB 自带目录'}, {id:'auto', name:'重新自动识别'}];
    $('#pvChips').innerHTML = [...head, ...kPresetRules].map(r =>
      `<button class="chip ${r.id === this.ruleId ? 'on' : ''}" onclick="Preview.applyRule('${r.id}')">${esc(r.name)}</button>`).join('');
  },
  applyRule(id){
    if (id === 'epub'){
      const s = this.st.split;
      this.split = {offsets:s.offsets.slice(), titles:s.titles.slice(), pattern:null, ruleId:null, mode:'epub', firstMatch:-1};
      this.ruleId = 'epub'; $('#pvRegex').value = '';
    } else if (id === 'auto'){
      this.split = autoDetectChapters(this.st.content);
      this.ruleId = 'auto'; $('#pvRegex').value = this.split.pattern || '';
    } else {
      const rule = kPresetRules.find(r => r.id === id) || kPresetRules[0];
      this.split = splitByPattern(this.st.content, rule.pattern, rule.id, 'pattern');
      this.ruleId = id; $('#pvRegex').value = rule.pattern;
    }
    $('#pvErr').classList.add('hidden');
    this.chips(); this.render();
  },
  applyCustom(){
    const text = $('#pvRegex').value.trim();
    const err = $('#pvErr');
    if (!text){ err.textContent = '正则不能为空'; err.classList.remove('hidden'); return; }
    try { new RegExp(text, 'mi'); } catch (e){ err.textContent = '正则无效：' + e.message; err.classList.remove('hidden'); return; }
    const r = splitByPattern(this.st.content, text, null, 'pattern');
    if (r.offsets.length <= 1){
      err.textContent = '这个正则没匹配到任何章节，换一个试试'; err.classList.remove('hidden');
      this.split = r; this.ruleId = 'custom'; this.chips(); this.render(); return;
    }
    err.classList.add('hidden');
    this.split = r; this.ruleId = 'custom'; this.chips(); this.render();
  },
  render(){
    const s = this.split, c = this.st.content;
    $('#pvCount').textContent = s.offsets.length + ' 章';
    $('#pvMode').textContent = {length:'按长度切分（没识别出章节格式）', epub:'EPUB 自带目录',
      auto:'自动识别', pattern:'自定义正则'}[s.mode] || s.mode;
    const rule = kPresetRules.find(r => r.id === s.ruleId);
    $('#pvSample').textContent = rule ? '示例：' + rule.sample : '';
    const n = s.offsets.length;
    let html = '';
    for (let i = 0; i < n; i++){
      const start = s.offsets[i], end = i + 1 < n ? s.offsets[i + 1] : c.length;
      html += `<div class="lrow"><span class="no">${i + 1}</span>` +
        `<span class="nm">${esc(s.titles[i] || ('第 ' + (i + 1) + ' 章'))}</span>` +
        `<span class="ln">${(end - start)} 字</span></div>`;
    }
    $('#pvList').innerHTML = html;
  },
  onceDone: null,
  done(){ if (this.onceDone){ const f = this.onceDone; this.onceDone = null; f(); } },
  cancel(){ $('#preview').classList.add('hidden'); this.st = null; this.done(); },
  async confirm(){
    const o = this.st, s = this.split, now = Date.now();
    if (o.bookId){
      const b = await Store.get(o.bookId);
      b.offsets = s.offsets.slice(); b.titles = s.titles.slice();
      b.pattern = s.pattern || null; b.mode = s.mode;
      b.progress = {ci:0, ratio:0, pos:0}; b.bookmarks = [];
      await Store.put(b);
      toast('已重新分章：' + s.offsets.length + ' 章');
    } else {
      await Store.put({
        id: 'b_' + now + '_' + Math.random().toString(36).slice(2, 7),
        title: o.title, author: o.author, description: o.description, cover: o.cover,
        sourceType: o.sourceType, size: o.size,
        content: o.content, blocks: o.blocks || [],
        offsets: s.offsets.slice(), titles: s.titles.slice(),
        pattern: s.pattern || null, mode: s.mode,
        progress: {ci:0, ratio:0, pos:0}, bookmarks: [],
        addedAt: now, lastRead: now
      });
      toast('已导入《' + o.title + '》' + s.offsets.length + ' 章');
    }
    $('#preview').classList.add('hidden'); this.st = null;
    renderShelf();
    this.done();
  }
};

/* ============================ 书架（横向条目） ============================ */
async function renderShelf(){
  let books = [];
  try {
    books = await Store.all();
  } catch (e) { books = []; }
  if (!Array.isArray(books)) books = [];
  // 过滤结构不完整的记录（跨版本残留 / 存储损坏），避免整页渲染崩掉
  books = books.filter(b => b && typeof b === 'object' && Array.isArray(b.offsets) && b.offsets.length);
  try { books.sort((a, b) => (b.lastRead || 0) - (a.lastRead || 0)); } catch (e) {}

  $('#empty').classList.toggle('hidden', books.length > 0);
  $('#blist').innerHTML = books.map(b => {
    const n = b.offsets.length, pct = pctOf(b);
    const p = b.progress || {};
    const titles = Array.isArray(b.titles) ? b.titles : [];
    const last = titles[p.ci] || ('第 ' + ((p.ci || 0) + 1) + ' 章');
    const cover = b.cover ? `<img src="${b.cover}" alt="">` : esc([...(b.title || '书')][0] || '书');
    return `<div class="brow" data-id="${b.id}">
      <div class="thumb" onclick="Reader.open('${b.id}')">${cover}</div>
      <div class="info" onclick="Reader.open('${b.id}')">
        <div class="nmwrap"><span class="nm">${esc(b.title)}</span></div>
        <div class="sub">${esc(b.author || (b.sourceType === 'epub' ? 'EPUB' : 'TXT'))} · ${n} 章</div>
        <div class="pbar"><i style="width:${pct}%"></i></div>
        <div class="sub">${pct}% · 上次：${esc(last)}</div>
      </div>
      <button class="ib" onclick="bookMenu(event,'${b.id}')">${ic('more_vert',24)}</button>
    </div>`;
  }).join('');
  hydrateIcons(document.getElementById('blist'));
  // 书名过长 → 横向滚动
  requestAnimationFrame(() => {
    document.querySelectorAll('.brow .nmwrap').forEach(w => {
      const span = w.querySelector('.nm');
      if (span.scrollWidth > w.clientWidth + 2){
        w.classList.add('marquee');
        span.innerHTML = span.innerHTML + '<span style="padding:0 24px"></span>' + span.innerHTML;
      }
    });
  });
}

      <b>导入</b>：${new Date(b.addedAt).toLocaleString()}

  if (act === 2){

      cover: b.cover, sourceType: b.sourceType, size: b.size});
    return;
  }
  if (act === 4){
    const b = await Store.get(id);
    if (await UI.confirm('删除这本书？', '《' + b.title + '》将从书架移除，此操作不可撤销。')){
      await Store.del(id); renderShelf(); toast('已删除');
    }
  }
}
/**
 * 分享：把书导出成 txt，交给系统分享面板。
 * 手机（Android / iOS）、macOS、Windows 的新版浏览器都支持带文件的 Web Share，
 * 会唤起系统分享菜单（微信 / 蓝牙 / 隔空投送 / 邮件…）。
 * 不支持的环境退化为导出下载。
 */
async function shareBook(id){
  const b = await Store.get(id);
  if (!b) return;
  const name = (b.title || '未命名').replace(/[\\/:*?"<>|]/g, '_') + '.txt';
  const body = b.content || '';
  // BOM 让 Windows 记事本也能正确识别 UTF-8
  const blob = new Blob(['\ufeff' + body], {type:'text/plain;charset=utf-8'});
  let file = null;
  try { file = new File([blob], name, {type:'text/plain;charset=utf-8'}); } catch (e) {}

  const isAbort = e => e && e.name === 'AbortError';   // 用户主动取消，不提示

  // 1. 系统分享面板（带文件）
  if (file && navigator.canShare && navigator.canShare({files:[file]})){
    try {
      await navigator.share({files:[file], title: b.title,
        text: b.author ? '《' + b.title + '》　作者：' + b.author : '《' + b.title + '》'});
      return;
    } catch (e){ if (isAbort(e)) return; }
  }
  // 2. 系统分享面板（只有文字）
  if (navigator.share){
    try {
      await navigator.share({title: b.title,
        text: (b.author ? '作者：' + b.author + '\n\n' : '') + body.slice(0, 800)});
      return;
    } catch (e){ if (isAbort(e)) return; }
  }
  // 3. 桌面兜底：直接导出文件
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    toast('当前环境不支持系统分享，已导出 ' + name);
  } catch (e){ toast('导出失败：' + e.message); }
}

async function chapterMenu(ev, i){

/* ============================ 全文搜索 ============================ */
const Search = {
  open(){ $('#search').classList.remove('hidden'); $('#sq').focus(); this.run($('#sq').value); },
  close(){ $('#search').classList.add('hidden'); },
  run(kw){
    const b = Reader.book;
    const box = $('#sList'), info = $('#sInfo');
    if (!b){ box.innerHTML = ''; return; }
    kw = (kw || '').trim();
    if (!kw){
      info.textContent = '在《' + b.title + '》中搜索';
      box.innerHTML = '<div class="empty" style="padding:50px 20px">输入关键词开始搜索</div>';
      return;
    }
    const text = b.content, low = text.toLowerCase(), k = kw.toLowerCase();
    const hits = [];
    let from = 0, guard = 0;
    while (hits.length < 300 && guard++ < 100000){
      const i = low.indexOf(k, from);
      if (i < 0) break;
      hits.push(i);
      from = i + Math.max(1, kw.length);
    }
    info.textContent = hits.length ? '找到 ' + hits.length + ' 处「' + kw + '」' : '没有找到「' + kw + '」';
    if (!hits.length){ box.innerHTML = ''; return; }
    const chOf = pos => {
      let lo = 0, hi = b.offsets.length - 1, ans = 0;
      while (lo <= hi){ const mid = (lo + hi) >> 1; if (b.offsets[mid] <= pos){ ans = mid; lo = mid + 1; } else hi = mid - 1; }
      return ans;
    };
    const rx = new RegExp('(' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    box.innerHTML = hits.map(pos => {
      const ci = chOf(pos);
      const stt = Math.max(0, pos - 26), en = Math.min(text.length, pos + kw.length + 34);
      const ctx = esc((stt > 0 ? '…' : '') + text.slice(stt, en).replace(/\s+/g, ' ') + (en < text.length ? '…' : ''));
      return `<div class="hit" onclick="Search.goto(${pos})">
        <div class="ch">${esc(b.titles[ci] || ('第 ' + (ci + 1) + ' 章'))}</div>
        <div>${ctx.replace(rx, '<mark>$1</mark>')}</div></div>`;
    }).join('');
  },
  goto(pos){
    const b = Reader.book;
    if (!b) return;
    let lo = 0, hi = b.offsets.length - 1, ci = 0;
    while (lo <= hi){ const mid = (lo + hi) >> 1; if (b.offsets[mid] <= pos){ ci = mid; lo = mid + 1; } else hi = mid - 1; }
    this.close();
    Reader.showChapter(ci, pos);
  }
};

  drawer(title, html){

    return new Promise(res => {
      const d = document.createElement('div');
      d.className = 'dlg';
      d.innerHTML = `<div class="box"><div class="h">${esc(title)}</div><div class="c">${body}</div>
        <div class="f ${list ? 'lstb' : ''}">${buttons.map((b, i) =>

      d.addEventListener('click', e => {
        const btn = e.target.closest('button[data-i]');
        if (btn){ d.remove(); res(+btn.dataset.i); return; }

      });

  confirm(t, m){ return this.dialog(t, esc(m), ['取消', '确定']).then(i => i === 1); },
  alert(t, html){ return this.dialog(t, html, ['知道了']).then(() => {}); },
  /**
   * MD3 菜单：锚定在触发元素旁展开，不是居中弹出的白框。
   * items: [{icon, text}]；返回被点项的索引，点外部返回 null
   */
  menu(anchor, items){
    return new Promise(res => {
      const r = anchor.getBoundingClientRect();
      const layer = document.createElement('div');
      layer.className = 'menu-layer';
      layer.innerHTML = '<div class="menu">' + items.map((it, i) =>
        `<button class="mi" data-i="${i}">${ic(it.icon, 20)}<span>${esc(it.text)}</span></button>`).join('') + '</div>';
      document.body.appendChild(layer);
      const menu = layer.querySelector('.menu');

      // 先量尺寸再定位，避免越界
      const mw = menu.offsetWidth, mh = menu.offsetHeight;
      let left = clamp(r.right - mw, 8, Math.max(8, window.innerWidth - mw - 8));
      let top = r.bottom + 4;
      if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';
      // 动画原点对准触发点，视觉上从按钮"长"出来
      const ox = clamp((r.left + r.width / 2 - left) / mw * 100, 0, 100);
      menu.style.transformOrigin = ox + '% ' + (top > r.top ? '0%' : '100%');
      requestAnimationFrame(() => menu.classList.add('in'));

      const close = v => {
        menu.classList.remove('in');
        setTimeout(() => layer.remove(), 160);
        res(v);
      };
      layer.addEventListener('click', e => {
        const b = e.target.closest('button[data-i]');
        close(b ? +b.dataset.i : null);

/* ============================ 手势 / 键盘 / 尺寸 ============================ */
const stage = $('#stage');
let ptr = null, pdir = 0;
stage.addEventListener('pointerdown', e => {
  if (!Reader.book) return;
  ptr = {x:e.clientX, y:e.clientY, t:Date.now()};
  pdir = 0;
});
stage.addEventListener('pointermove', e => {
  if (!ptr || !Reader.book) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
  if (!pdir){
    if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
    pdir = dx < 0 ? 1 : -1;
    if (!Flip.begin(pdir)){ ptr = null; pdir = 0; return; }
  }
  const w = stage.clientWidth || 1;
  Flip.update(clamp(Math.abs(dx) / (w * 0.55), 0, 1));
});
function endPointer(e){
  if (!ptr) return;
  const w = stage.clientWidth || 1;
  if (pdir && Flip.active){
    const p = clamp(Math.abs(e.clientX - ptr.x) / (w * 0.55), 0, 1);
    if (p > 0.4) Flip.commit(); else Flip.cancel();
  } else if (!pdir && Settings.data.tapTurn && Date.now() - ptr.t < 500){
    const dir = e.clientX < w * 0.32 ? -1 : 1;
    Reader.turn(dir);
  }
  ptr = null; pdir = 0;
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);

document.addEventListener('keydown', e => {
  if (!Reader.book || $('#reader').classList.contains('hidden')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){ e.preventDefault(); Reader.turn(1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); Reader.turn(-1); }
  if (e.key === 'Escape') UI.closeDrawer();
});

/** 把静态 HTML 里的 data-icon 占位替换成内联 SVG */
function hydrateIcons(root){
  (root || document).querySelectorAll('[data-ic],[data-icon]').forEach(el => {
    const name = el.dataset.ic || el.dataset.icon;
    const size = +(el.dataset.icSize || el.dataset.iconSize) || 22;
    const svg = ic(name, size);
    const txt = el.dataset.icText || el.dataset.iconText;
    el.innerHTML = txt ? svg + '<span>' + esc(txt) + '</span>' : svg;
    delete el.dataset.ic; delete el.dataset.icon;
  });
}
